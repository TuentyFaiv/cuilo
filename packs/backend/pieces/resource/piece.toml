schema_version = 1
name = "resource"
description = "A REST resource in layers: model, repository, service, routes and tests; adds the `error` piece if missing."
target = "src/modules/example-items"
requires = ["error"]

[inputs.name]
type = "string"
description = "Singular name, e.g. `blog-post`."
example = "ExampleItem"

[inputs.plural]
type = "string"
description = "Plural name for routes, tables and folders, e.g. `blog-posts`."
example = "ExampleItems"

[inputs.tests]
type = "bool"
description = "Add tests; on by default when the project can run them."
prompt = "Add tests?"
default_when = "stack.vitest || stack.pytest || stack.go || stack.rust"

[inputs.module]
type = "string"
description = "Go module path from `go.mod`."
example = "example.com/app"
default = "example.com/app"

[[variants]]
name = "hono"
when = { framework = "hono", language = "typescript" }
files = "files/typescript"

[[variants]]
name = "express"
when = { framework = "express", language = "typescript" }
files = "files/typescript"

[[variants]]
name = "axum"
when = { framework = "axum" }
target = "src/example_items"

[[variants]]
name = "fastapi"
when = { framework = "fastapi" }
target = ""

[[variants]]
name = "chi"
when = { framework = "chi" }
files = "files/go"
target = "internal/exampleitems"

[[variants]]
name = "echo"
when = { framework = "echo" }
files = "files/go"
target = "internal/exampleitems"

[[files]]
path = "example-item.table.ts"
when = "stack.drizzle"

[[files]]
path = "example-item.drizzle-repository.ts"
when = "stack.drizzle"

[[files]]
path = "example-item.prisma-repository.ts"
when = "stack.prisma"

[[files]]
path = "example-item.service.test.ts"
when = "tests"

[[files]]
path = "example-item.routes.test.ts"
when = "tests"

[[files]]
path = "app/example_items/tables.py"
when = "stack.sqlalchemy"

[[files]]
path = "tests/example_items/test_example_item_service.py"
when = "tests"

[[files]]
path = "tests/example_items/test_example_item_router.py"
when = "tests"

[[files]]
path = "gorm_repository.go"
when = "stack.gorm"

[[files]]
path = "service_test.go"
when = "tests"

[[files]]
path = "handler_test.go"
when = "tests"

[[steps]]
text = "Add `model ExampleItem` to `schema.prisma` with `id String @id @default(uuid())`, `name String`, `createdAt DateTime @default(now())` and `updatedAt DateTime @updatedAt`, then run `prisma generate`."
variants = ["hono", "express"]
when = "stack.prisma"

[[steps]]
text = "Mount the routes in `src/index.ts` with `app.route(\"/example-items\", exampleItemRoutes(new ExampleItemService(new InMemoryExampleItemRepository())))`."
variants = ["hono"]
when = "!stack.drizzle && !stack.prisma"

[[steps.patches]]
kind = "import"
file = "src/index.ts"
import = 'import { exampleItemRoutes } from "./modules/example-items/example-item.routes";'

[[steps.patches]]
kind = "import"
file = "src/index.ts"
import = 'import { ExampleItemService } from "./modules/example-items/example-item.service";'

[[steps.patches]]
kind = "import"
file = "src/index.ts"
import = 'import { InMemoryExampleItemRepository } from "./modules/example-items/example-item.repository";'

[[steps.patches]]
kind = "anchor"
file = "src/index.ts"
anchor = "export default app"
position = "before"
insert = "app.route(\"/example-items\", exampleItemRoutes(new ExampleItemService(new InMemoryExampleItemRepository())));\n\n"

[[steps]]
text = "Mount the routes in `src/index.ts` with `app.route(\"/example-items\", exampleItemRoutes(new ExampleItemService(new DrizzleExampleItemRepository(db))))`, where `db` is your Drizzle database."
variants = ["hono"]
when = "stack.drizzle"

[[steps]]
text = "Mount the routes in `src/index.ts` with `app.route(\"/example-items\", exampleItemRoutes(new ExampleItemService(new PrismaExampleItemRepository(prisma))))`, where `prisma` is your `PrismaClient`."
variants = ["hono"]
when = "stack.prisma"

[[steps]]
text = "Mount the routes after `app.use(express.json())` with `app.use(\"/example-items\", exampleItemRoutes(new ExampleItemService(new InMemoryExampleItemRepository())))`."
variants = ["express"]
when = "!stack.drizzle && !stack.prisma"

[[steps]]
text = "Mount the routes after `app.use(express.json())` with `app.use(\"/example-items\", exampleItemRoutes(new ExampleItemService(new DrizzleExampleItemRepository(db))))`, where `db` is your Drizzle database."
variants = ["express"]
when = "stack.drizzle"

[[steps]]
text = "Mount the routes after `app.use(express.json())` with `app.use(\"/example-items\", exampleItemRoutes(new ExampleItemService(new PrismaExampleItemRepository(prisma))))`, where `prisma` is your `PrismaClient`."
variants = ["express"]
when = "stack.prisma"

[[steps]]
text = "Declare the module with `mod example_items;` in `src/main.rs`."
variants = ["axum"]

[[steps.patches]]
kind = "anchor"
file = "src/main.rs"
anchor = "#[tokio::main]"
position = "before"
insert = "mod example_items;\n\n"

[[steps]]
text = "Nest the routes before your router's layers with `.nest(\"/example-items\", example_items::routes(Arc::new(ExampleItemService::new(InMemoryExampleItemRepository::default()))))`, importing them from `example_items`."
variants = ["axum"]
when = "!stack.sqlx"

[[steps]]
text = "Nest the routes before your router's layers with `.nest(\"/example-items\", example_items::routes(Arc::new(ExampleItemService::new(PgExampleItemRepository::new(pool)))))`, importing them from `example_items`, where `pool` is your `PgPool`."
variants = ["axum"]
when = "stack.sqlx"

[[steps]]
text = "Include the routes in `app/main.py` with `app.include_router(example_items_router)`, importing `router as example_items_router` from `app.example_items.router`."
variants = ["fastapi"]

[[steps.patches]]
kind = "anchor"
file = "app/main.py"
anchor = "app = FastAPI()"
position = "before"
insert = "from app.example_items.router import router as example_items_router\n\n"

[[steps.patches]]
kind = "anchor"
file = "app/main.py"
anchor = "app = FastAPI()"
insert = "app.include_router(example_items_router)"

[[steps]]
text = "Mount the routes with `r.Mount(\"/example-items\", exampleitems.NewHandler(exampleitems.NewService(exampleitems.NewMemoryRepository())).Routes())`, importing `example.com/app/internal/exampleitems`."
variants = ["chi"]
when = "!stack.gorm"

[[steps]]
text = "Mount the routes with `r.Mount(\"/example-items\", exampleitems.NewHandler(exampleitems.NewService(exampleitems.NewGormRepository(db))).Routes())`, importing `example.com/app/internal/exampleitems`, where `db` is your `*gorm.DB`."
variants = ["chi"]
when = "stack.gorm"

[[steps]]
text = "Register the routes with `exampleitems.NewHandler(exampleitems.NewService(exampleitems.NewMemoryRepository())).Register(e.Group(\"/example-items\"))`, importing `example.com/app/internal/exampleitems`."
variants = ["echo"]
when = "!stack.gorm"

[[steps]]
text = "Register the routes with `exampleitems.NewHandler(exampleitems.NewService(exampleitems.NewGormRepository(db))).Register(e.Group(\"/example-items\"))`, importing `example.com/app/internal/exampleitems`, where `db` is your `*gorm.DB`."
variants = ["echo"]
when = "stack.gorm"

[[dependencies]]
ecosystem = "npm"
name = "zod"
version = "^4.1"
variants = ["hono", "express"]

[[dependencies]]
ecosystem = "npm"
name = "vitest"
version = "^4.0"
dev = true
variants = ["hono", "express"]
when = "tests"

[[dependencies]]
ecosystem = "cargo"
name = "serde"
version = "1"
features = ["derive"]
variants = ["axum"]

[[dependencies]]
ecosystem = "cargo"
name = "chrono"
version = "0.4"
features = ["serde"]
variants = ["axum"]

[[dependencies]]
ecosystem = "cargo"
name = "uuid"
version = "1"
features = ["serde", "v7"]
variants = ["axum"]

[[dependencies]]
ecosystem = "cargo"
name = "tokio"
version = "1"
features = ["macros", "rt-multi-thread"]
dev = true
variants = ["axum"]
when = "tests"

[[dependencies]]
ecosystem = "cargo"
name = "tower"
version = "0.5"
features = ["util"]
dev = true
variants = ["axum"]
when = "tests"

[[dependencies]]
ecosystem = "cargo"
name = "serde_json"
version = "1"
dev = true
variants = ["axum"]
when = "tests"

[[dependencies]]
ecosystem = "pypi"
name = "pytest"
version = ">=8"
dev = true
variants = ["fastapi"]
when = "tests"

[[dependencies]]
ecosystem = "pypi"
name = "httpx"
version = ">=0.28"
dev = true
variants = ["fastapi"]
when = "tests"

[[dependencies]]
ecosystem = "go"
name = "github.com/google/uuid"
version = "v1.6.0"
variants = ["chi", "echo"]
