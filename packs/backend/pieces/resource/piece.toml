schema_version = 1
name = "resource"
description = "A REST resource in layers: model, repository, service, routes and tests; adds the `error` piece if missing."
target = "src/modules/example-items"
requires = ["error"]

[inputs.name]
type = "string"
description = "Singular name, e.g. `blog-post`."
example = "ExampleItem"

[inputs.plural]
type = "string"
description = "Plural name for routes, tables and folders, e.g. `blog-posts`."
example = "ExampleItems"

[inputs.tests]
type = "bool"
description = "Add tests; on by default when the project can run them."
prompt = "Add tests?"
default_when = "stack.vitest || stack.pytest || stack.go || stack.rust"

[inputs.module]
type = "string"
description = "Go module path from `go.mod`."
example = "example.com/app"
default = "example.com/app"

[translations.es-mx]
description = "Un recurso REST por capas: modelo, repositorio, servicio, rutas y pruebas; agrega la pieza `error` si falta."

[translations.es-mx.inputs]
name = "Nombre en singular, p. ej. `blog-post`."
plural = "Nombre en plural para rutas, tablas y carpetas, p. ej. `blog-posts`."
tests = "Agrega pruebas; se activa por defecto cuando el proyecto puede correrlas."
module = "Ruta del módulo de Go, tomada de `go.mod`."

[[variants]]
name = "hono"
when = { framework = "hono", language = "typescript" }
files = "files/typescript"

[[variants]]
name = "express"
when = { framework = "express", language = "typescript" }
files = "files/typescript"

[[variants]]
name = "axum"
when = { framework = "axum" }
target = "src/example_items"

[[variants]]
name = "fastapi"
when = { framework = "fastapi" }
target = ""

[[variants]]
name = "chi"
when = { framework = "chi" }
files = "files/go"
target = "internal/exampleitems"

[[variants]]
name = "echo"
when = { framework = "echo-v4" }
files = "files/go"
target = "internal/exampleitems"

[[variants]]
name = "echo-v5"
when = { framework = "echo-v5" }
files = "files/go"
target = "internal/exampleitems"

[[files]]
path = "example-item.table.ts"
when = "stack.drizzle"

[[files]]
path = "example-item.drizzle-repository.ts"
when = "stack.drizzle"

[[files]]
path = "example-item.prisma-repository.ts"
when = "stack.prisma"

[[files]]
path = "example-item.service.test.ts"
when = "tests"

[[files]]
path = "example-item.routes.test.ts"
when = "tests"

[[files]]
path = "app/example_items/tables.py"
when = "stack.sqlalchemy"

[[files]]
path = "tests/example_items/test_example_item_service.py"
when = "tests"

[[files]]
path = "tests/example_items/test_example_item_router.py"
when = "tests"

[[files]]
path = "tests/example_items/__init__.py"
when = "tests"

[[files]]
path = "gorm_repository.go"
