schema_version = 1
name = "atom"
description = "The smallest UI building block, such as a badge, icon or label."
target = "src/ui/atoms"

[inputs.name]
type = "string"
description = "Component name, e.g. `status-badge`."
example = "ExampleAtom"

[inputs.tests]
type = "bool"
description = "Add a test file; on by default when the project can run it."
prompt = "Add tests?"
default_when = "stack.vitest || !(stack.javascript || stack.typescript)"

[inputs.app]
type = "string"
description = "App name: the SwiftUI app folder or the Flutter package."
example = "ExampleApp"
default = "app"

[inputs.package]
type = "string"
description = "Kotlin package for Jetpack Compose."
example = "com.example.app"
default = "com.example.app"

[translations.es-mx]
description = "El bloque de UI más pequeño, como un badge, un ícono o una etiqueta."

[translations.es-mx.inputs]
name = "Nombre del componente, p. ej. `status-badge`."
tests = "Agrega un archivo de pruebas; se activa por defecto cuando el proyecto puede correrlo."
app = "Nombre de la app: la carpeta de la app de SwiftUI o el paquete de Flutter."
package = "Paquete de Kotlin para Jetpack Compose."

[[variants]]
name = "angular"
when = { framework = "angular" }

[[variants]]
name = "qwik"
when = { framework = "qwik", language = "typescript" }

[[variants]]
name = "solid"
when = { framework = "solid-v2", language = "typescript" }

[[variants]]
name = "astro"
when = { framework = "astro", language = "typescript" }

[[variants]]
name = "svelte"
when = { framework = "svelte", language = "typescript" }

[[variants]]
name = "vue"
when = { framework = "vue", language = "typescript" }

[[variants]]
name = "react"
when = { framework = "react", language = "typescript" }

[[variants]]
name = "lit"
when = { framework = "lit", language = "typescript" }

[[variants]]
name = "leptos"
when = { framework = "leptos" }

[[variants]]
name = "dioxus"
when = { framework = "dioxus" }

[[variants]]
name = "yew"
when = { framework = "yew" }

[[variants]]
name = "flutter"
when = { framework = "flutter" }
target = ""

[[variants]]
name = "compose-multiplatform"
when = { framework = "compose-multiplatform" }
target = ["shared", "composeApp"]

[[variants]]
name = "compose"
when = { framework = "compose" }
target = "app"

[[variants]]
name = "swiftui-package"
when = { language = "swift", package_manager = "swiftpm" }
target = ""

[[variants]]
name = "swiftui"
when = { language = "swift" }
target = ""

[[files]]
path = "example-atom/example-atom.test.tsx"
when = "tests"

[[files]]
path = "example-atom/example-atom.test.ts"
when = "tests"

[[files]]
path = "example-atom/example-atom.svelte.test.ts"
when = "tests"

[[files]]
path = "example-atom/example-atom.spec.ts"
when = "tests"

[[files]]
path = "example-atom/example-atom.module.css"
when = "!stack.tailwind"

[[files]]
path = "example-atom/example-atom.css"
when = "!stack.tailwind"

[[files]]
path = "test/ui/atoms/example_atom_test.dart"
when = "tests"

[[files]]
path = "src/test/java/com/example/app/ui/atoms/ExampleAtomTest.kt"
when = "tests"

[[files]]
path = "src/jvmTest/kotlin/com/example/app/ui/atoms/ExampleAtomTest.kt"
when = "tests"

[[files]]
path = "ExampleAppTests/UI/Atoms/ExampleAtomTests.swift"
when = "tests"

[[files]]
path = "Tests/ExampleAppTests/UI/Atoms/ExampleAtomTests.swift"
when = "tests"

[[steps]]
text = "Declare the module with `pub mod example_atom;` in `src/ui/atoms/mod.rs`, which `src/ui/mod.rs` declares with `pub mod atoms;`."
variants = ["leptos", "dioxus", "yew"]

[[steps]]
text = "Let the tests run on the JVM with Robolectric: in `app/build.gradle.kts`, add `org.robolectric:robolectric` and `androidx.compose.ui:ui-test-junit4`, with the Compose BOM, to `testImplementation` and `androidx.compose.ui:ui-test-manifest` to `debugImplementation`, and set `testOptions.unitTests.isIncludeAndroidResources = true`."
variants = ["compose"]
when = "tests"

[[steps]]
text = "Let the tests run on the JVM target: add `org.jetbrains.compose.ui:ui-test` and `compose.desktop.currentOs` to the `jvmTest` dependencies of the module the piece is in, `shared` or `composeApp`."
variants = ["compose-multiplatform"]
when = "tests"

[[dependencies]]
ecosystem = "npm"
name = "vitest"
version = "^4.0"
dev = true
variants = ["qwik", "solid", "astro", "svelte", "vue", "react", "lit"]
when = "tests"

[[dependencies]]
ecosystem = "npm"
name = "@testing-library/react"
version = "^16.3"
dev = true
variants = ["react"]
when = "tests"

[[dependencies]]
ecosystem = "npm"
name = "@testing-library/dom"
version = "^10.4"
dev = true
variants = ["react"]
when = "tests"

[[dependencies]]
ecosystem = "npm"
name = "@solidjs/testing-library"
version = "^1.0.0-rc.2"
dev = true
variants = ["solid"]
when = "tests"

[[dependencies]]
ecosystem = "npm"
name = "@testing-library/svelte"
version = "^5.2"
dev = true
variants = ["svelte"]
when = "tests"

[[dependencies]]
ecosystem = "npm"
name = "@vue/test-utils"
version = "^2.4"
dev = true
variants = ["vue"]
when = "tests"

[[dependencies]]
ecosystem = "pub"
name = "material_ui"
version = "^1.1.0"
variants = ["flutter"]
